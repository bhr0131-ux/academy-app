<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="preload" href="/assets/fonts/cafe24-ssurround.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/stage-adventure-meadow.webp" as="image" fetchpriority="high" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>미션팡</title>
    <style>
      /* 카페24 써라운드 — 앱 전체 기본 글씨체 (사용자 확정). 앱 내장(로컬) 파일이라
         오프라인(Capacitor)에서도 동작한다.
         · 제작사 배포 woff2를 '그대로' 쓴다 — 전체 11,440자(392KB)로, 예전 두 폰트를
           상용 2,780자로 서브셋한 합(1.13MB)보다도 작다. 서브셋을 안 하니 글자가 빠질 일도 없다.
         · 단일 굵기(Bold/700) 폰트라 font-weight 범위를 넓게 열어 둔다.
           이렇게 해야 브라우저가 굵게를 '합성'해서 뭉개는 일이 없다.
         · 원본 OTF·라이선스: art-src/font-cafe24-ssurround.otf / -LICENSE.pdf (재가공용, 배포 미포함)
         · 이전 폰트(온글잎 의연체·Pretendard SemiBold) 원본은 용량 정리로 삭제했다 —
           되돌릴 일이 생기면 git 히스토리에서 꺼낸다. */
      @font-face {
        font-family: 'Cafe24Ssurround';
        src: url('/assets/fonts/cafe24-ssurround.woff2') format('woff2');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      /* 전역 기본 — 컴포넌트가 따로 지정하지 않은 글자도 모두 이 폰트로 (사용자: 전체적으로 변경).
         이모지는 이 폰트에 글리프가 없어 시스템 이모지 폰트로 자동 폴백된다. */
      html, body, button, input, textarea, select {
        font-family: 'Cafe24Ssurround', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      }
      /* 누를 때 안드로이드 웹뷰가 씌우는 파란 네모(터치 하이라이트)를 없앤다 (사용자 요청).
         눌린 느낌은 앱이 직접 준다(.jelly-tap / .icon-tap / .card-tap 축소 연출).
         키보드 접근성용 outline(:focus-visible)은 브라우저 기본 그대로 남겨 둔다 —
         이건 마우스·손가락이 아니라 Tab 키로 옮겼을 때만 보이므로 방해되지 않는다. */
      * { -webkit-tap-highlight-color: transparent; }
      /* 첫 화면이 '탭 줄 아래'에서 딱 끝나게 무대(캐릭터 화면) 높이를 잡는다 (사용자 확정).
         빼는 값 = 시트 머리(손잡이 30 + 탭 줄 52) − 시트 겹침(24) + 무대 위 여백(8) = 66px.
         테두리 장착 시엔 위아래 4px씩 더 붙으므로 74px. (실측으로 맞춘 값)

         [2026-08-07 수정] 높이를 뷰포트 단위로 직접 쓰면, 스크롤할 때 주소창이
         접혔다 펴지면서 화면 높이가 바뀔 때마다 무대가 같이 늘었다 줄었다 한다
         (실측: 무대 높이 = 화면 높이 − 66 을 정확히 따라감. 큰 기기일수록 주소창이
         두꺼워 더 눈에 띈다). 그래서 아래 스크립트가 '주소창이 보이는 상태의 높이'를
         재서 --am-vh 에 px로 고정하고, 회전처럼 진짜로 화면이 바뀔 때만 갱신한다.
         스크립트가 돌기 전 첫 페인트를 위해 기본값은 svh(구형 웹뷰는 vh)로 둔다. */
      :root { --am-vh: 100vh; }
      @supports (height: 100svh) { :root { --am-vh: 100svh; } }
      .amStageFill   { min-height: calc(var(--am-vh) - 66px); }
      .amStageFillBd { min-height: calc(var(--am-vh) - 74px); }
      /* 탭 내용 최소 높이 — 내용이 짧으면 문서가 짧아 손잡이를 눌러도 탭이 맨 위까지 못 올라간다.
         '탭이 맨 위에 붙었을 때 화면을 채울 만큼'(화면 − 손잡이30 − 탭52)을 최소로 보장한다. */
      .amTabFill { min-height: calc(var(--am-vh) - 82px); }
      /* 오늘의 발견 연출 — 보통은 톡 떠오르기(0.5초), 전설만 커졌다 작아지기(3초).
         전설을 매일 보면 특별하지 않으므로 확률은 데이터에서 낮게 잡았다. */
      @keyframes discoRise { from { opacity:0; transform:translateY(6px) scale(.92); } to { opacity:1; transform:none; } }
      @keyframes discoPop {
        0%   { opacity:0; transform:translateY(8px) scale(.8); }
        12%  { opacity:1; transform:translateY(0) scale(1.14); }
        22%  { transform:scale(1); }
        70%  { transform:scale(1.05); }
        100% { transform:scale(1); }
      }
      @keyframes discoTwinkle { 0%,100% { opacity:.25; transform:scale(.8); } 50% { opacity:1; transform:scale(1.25); } }
      /* ("먹이 +1" 연출은 지도 발견 지점으로 이동 — AdventureMap의 amGainUp 사용) */
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- 화면 높이 고정 — 스크롤 중 주소창이 접혔다 펴져도 무대 높이가 안 흔들리게.
         기준은 '가장 작은 높이'(=주소창이 보일 때)를 쓴다. svh의 뜻과 같은데,
         브라우저·웹뷰가 svh를 어떻게 계산하든 상관없이 같게 동작한다.
         React보다 먼저 돌려서 첫 페인트부터 확정된 값이 쓰이게 한다. -->
    <script>
      (function () {
        var root = document.documentElement, lockW = 0, lockH = 0;
        var BAR_MAX = 200;   // 주소창 하나로 설명되는 최대 높이 차. 그 이상이면 키보드거나 창 크기 변경이다.
        // 키보드가 올라오면 화면 높이가 크게 줄어드는데, 그걸 '주소창이 보이는 높이'로
        // 착각해 기준을 낮추면 키보드를 내린 뒤에도 무대가 작아진 채로 굳는다.
        function typing() {
          var el = document.activeElement;
          return !!el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName);
        }
        function apply() {
          var w = window.innerWidth, h = window.innerHeight;
          if (!h) return;
          if (w !== lockW) { lockW = w; lockH = h; }                 // 회전·창 폭 변경 → 기준을 새로 잡는다
          else if (h < lockH) {
            if (typing() || lockH - h > BAR_MAX) return;             // 키보드 → 무시
            lockH = h;                                               // 주소창이 보일 때의 높이 = 가장 작은 값
          }
          else if (h - lockH > BAR_MAX) { lockH = h; }               // 창 크기 조절처럼 큰 변화만 반영
          else return;                                               // 주소창이 접힌 것뿐 → 무시
          root.style.setProperty("--am-vh", lockH + "px");
        }
        apply();
        window.addEventListener("resize", apply);
        window.addEventListener("orientationchange", function () {
          lockW = 0; setTimeout(apply, 250);                         // 회전은 값이 늦게 잡혀 한 박자 뒤에 다시 잰다
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
