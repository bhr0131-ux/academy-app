<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>미션팡</title>
    <style>
      /* 온글잎 의연체 — 홈 헤드라인 손글씨용. 앱 내장(로컬) 파일이라 오프라인(Capacitor)에서도 동작.
         원본 TTF: art-src/font-ownglyph-euiyeonchae.ttf (재가공용, 배포 미포함) */
      @font-face {
        font-family: 'Uiyeun';
        src: url('/assets/fonts/ownglyph-euiyeonchae.woff2') format('woff2');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      /* G마켓 산스 Bold — 하단 시트 타일(모험/미션/캐릭터) 라벨용. 앱 내장(로컬).
         원본 OTF: art-src/font-gmarket-sans-bold.otf (재가공용, 배포 미포함) */
      @font-face {
        font-family: 'GmarketSansBold';
        src: url('/assets/fonts/gmarket-sans-bold.woff2') format('woff2');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      /* 온글잎 콘콘체 — 타일 큰 제목용 / Pretendard SemiBold — 타일 작은 글씨용. 앱 내장(로컬).
         원본: art-src/font-ownglyph-concon.ttf, art-src/font-pretendard-semibold.otf */
      @font-face {
        font-family: 'OwnglyphConCon';
        src: url('/assets/fonts/ownglyph-concon.woff2') format('woff2');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'PretendardSemiBold';
        src: url('/assets/fonts/pretendard-semibold.woff2') format('woff2');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
